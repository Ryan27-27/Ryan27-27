<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Aryan Adityaa — Build Secure Systems</title>
<desc id="desc">Minimal dark portfolio banner with a clean typographic identity, subtle code lines, and a geometric shield-and-circuit symbol.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#101b31"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1e3a5f" stroke-width=".7" opacity=".35"/></pattern>
</defs>
<rect width="1400" height="420" rx="22" fill="url(#bg)"/>
<rect width="1400" height="420" rx="22" fill="url(#grid)"/>
<circle cx="1160" cy="190" r="210" fill="#0ea5e9" opacity=".07"/>
