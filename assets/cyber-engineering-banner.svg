    <rect x="264" width="150" height="34" rx="17" fill="#201327" stroke="#9d174d"/><text x="339" y="22" text-anchor="middle" fill="#fbcfe8">APP SECURITY</text>
  </g>
</g>
<!-- restrained shield / circuit mark -->
