  <text x="76" y="239" fill="#dbeafe" font-size="25" font-weight="500">Build reliable systems. Design for security.</text>
  <text x="76" y="278" fill="#9fb4d0" font-size="19">Backend &amp; distributed systems  /  AI engineering  /  Application security</text>
