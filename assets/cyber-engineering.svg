<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Aryan Adityaa — Security and Development Engineering</title>
<desc id="desc">A dark futuristic engineering workspace with a holographic globe, developer workstation, security and development panels, and technology disciplines.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#07172e"/><stop offset="1" stop-color="#080d1b"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12345a" stop-opacity=".92"/><stop offset="1" stop-color="#071629" stop-opacity=".94"/></linearGradient>
  <radialGradient id="globe"><stop stop-color="#38bdf8" stop-opacity=".28"/><stop offset=".72" stop-color="#1d4ed8" stop-opacity=".12"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#16416b" stroke-width="1" opacity=".28"/></pattern>
</defs>

<rect width="1600" height="650" rx="22" fill="url(#bg)"/>
<rect width="1600" height="650" rx="22" fill="url(#grid)"/>
